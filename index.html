<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>あなたの名前 | Official Links</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- プロフィール部分 -->
        <header class="profile">
            <!-- 画像のファイル名が profile.png などの場合はここを変更してください -->
            <img src="images/profile.jpg" alt="プロフィール画像" class="profile-img">
            <h1 class="name">あなたの名前 / 名義</h1>
            <p class="bio">ここに簡単な自己紹介や肩書きを書きます。<br>Webディレクター / 広報 / PR</p>
        </header>

        <!-- リンク集ボタン部分 -->
        <main class="links">
            <a href="https://instagram.com/ユーザー名" target="_blank" rel="noopener" class="link-btn">
                Instagram
            </a>
            <a href="https://x.com/ユーザー名" target="_blank" rel="noopener" class="link-btn">
                X (Twitter)
            </a>
            <a href="https://note.com/ユーザー名" target="_blank" rel="noopener" class="link-btn">
                note / ブログ
            </a>
            <a href="mailto:your-email@example.com" class="link-btn highlight">
                お問い合わせ（メール）
            </a>
        </main>

        <!-- フッター -->
        <footer>
            <p>&copy; 2026 Your Name. All Rights Reserved.</p>
        </footer>
    </div>
</body>
</html>
